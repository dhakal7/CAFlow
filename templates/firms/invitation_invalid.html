{% extends "layouts/auth.html" %}
{% load static %}

{% block title %}Invitation Invalid &mdash; {{ APP_NAME }}{% endblock %}

{% block auth_content %}
<div style="text-align: center; padding: 0.5rem 0;">
  <div style="width: 52px; height: 52px; border-radius: 50%; background: rgba(220, 38, 38, 0.1); color: var(--cf-danger); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>
  <h2 style="font-size: 1.35rem; margin-bottom: 0.5rem; color: var(--cf-primary-navy); font-weight: 700;">Invitation Expired or Invalid</h2>
  <p style="font-size: 0.875rem; color: var(--cf-text-secondary); line-height: 1.5; margin-bottom: 1.5rem;">
    {{ message }}
  </p>

  <a href="{% url 'accounts:login' %}" class="cf-btn cf-btn-secondary" style="width: 100%;">
    Return to Sign In
  </a>
</div>
{% endblock %}
