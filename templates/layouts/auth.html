{% extends "base.html" %}
{% load static %}

{% block content %}
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: var(--cf-bg); padding: 1.5rem;">
  <div style="width: 100%; max-width: 440px;">
    
    <!-- Logo & Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="{% url 'core:landing' %}" style="display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none;">
        <div style="width: 40px; height: 40px; background: var(--cf-primary-navy); border-radius: var(--cf-radius-md); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1.15rem;">
          CF
        </div>
        <div style="text-align: left;">
          <div style="font-size: 1.35rem; font-weight: 800; color: var(--cf-primary-navy); line-height: 1.1; letter-spacing: -0.02em;">
            {{ APP_NAME }}
          </div>
          <div style="font-size: 0.6875rem; font-weight: 600; color: var(--cf-text-muted); text-transform: uppercase; letter-spacing: 0.05em;">
            Nepal CA Practice OS
          </div>
        </div>
      </a>
    </div>

    <!-- Auth Card -->
    <div class="cf-card" style="padding: 2.25rem 2rem; box-shadow: var(--cf-shadow-lg);">
      {% block auth_content %}{% endblock %}
    </div>

    <!-- Footer Security Note -->
    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.75rem; color: var(--cf-text-muted);">
      <div style="display: inline-flex; align-items: center; gap: 0.35rem;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>End-to-end encrypted &bull; Built for ICAN Certified Firms</span>
      </div>
    </div>
  </div>
</div>
{% endblock %}
