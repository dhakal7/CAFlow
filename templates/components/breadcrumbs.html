{# CAFlow Reusable Breadcrumbs Component #}
<nav aria-label="Breadcrumb">
  <ol class="cf-breadcrumbs">
    <li>
      <a href="{% url 'core:dashboard' %}" style="display: flex; align-items: center; color: var(--cf-text-muted);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Workspace
      </a>
    </li>
    {% for item in items %}
      <li class="cf-breadcrumb-separator">/</li>
      {% if forloop.last or not item.url %}
        <li style="color: var(--cf-text-primary); font-weight: 600;" aria-current="page">{{ item.title }}</li>
      {% else %}
        <li><a href="{{ item.url }}" style="color: var(--cf-text-muted);">{{ item.title }}</a></li>
      {% endif %}
    {% endfor %}
  </ol>
</nav>
