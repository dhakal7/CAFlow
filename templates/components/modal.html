{# CAFlow Reusable Modal Component #}
<div class="cf-modal-backdrop {{ extra_classes|default:'' }}" id="{{ id }}" role="dialog" aria-modal="true" aria-labelledby="{{ id }}-title">
  <div class="cf-modal-dialog" style="{% if size_max_width %}max-width: {{ size_max_width }};{% endif %}">
    <div class="cf-modal-header">
      <h3 class="cf-modal-title" id="{{ id }}-title">{{ title }}</h3>
      <button type="button" class="cf-modal-close-btn" data-cf-modal-close aria-label="Close dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    
    <div class="cf-modal-body">
      {{ body_html|default:content|safe }}
    </div>

    {% if footer_html %}
      <div class="cf-modal-footer">
        {{ footer_html|safe }}
      </div>
    {% endif %}
  </div>
</div>
